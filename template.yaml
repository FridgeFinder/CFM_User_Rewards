AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  CFM User Rewards Service — awards points and aggregates action stats
  from StatusUpdateCreated events.

Globals:
  Function:
    Runtime: python3.11
    Architectures:
      - x86_64
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        LOG_LEVEL: INFO
        DEPLOYMENT_TARGET: !Ref DeploymentTarget
        USER_ACTION_STATS_TABLE: !Sub user_action_stats_${Environment}
        USER_POINTS_HISTORY_TABLE: !Sub user_points_history_${Environment}
    LoggingConfig:
      LogFormat: JSON

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  DeploymentTarget:
    Type: String
    Description: Choose between local or AWS deployment
    Default: aws
    AllowedValues:
      - local
      - aws
  CFMHostedZoneId:
    Type: String
    Description: Hosted Zone ID from the Route53 console

Resources:

  # ──────────────────────────────────────────────────────────────
  # DLQ for failed consumer invocations
  # ──────────────────────────────────────────────────────────────
  RewardsConsumerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "user-rewards-dlq-${Environment}"
      MessageRetentionPeriod: 1209600   # 14 days

  # ──────────────────────────────────────────────────────────────
  # ACM — SSL Certificate
  # ──────────────────────────────────────────────────────────────
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "user-rewards-api-${Environment}.communityfridgefinder.com"
      DomainValidationOptions:
        - DomainName: !Sub "user-rewards-api-${Environment}.communityfridgefinder.com"
          HostedZoneId: !Ref CFMHostedZoneId
      ValidationMethod: DNS

  # ──────────────────────────────────────────────────────────────
  # API Gateway — HTTP API
  # ──────────────────────────────────────────────────────────────
  UserHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowMethods:
          - GET
        AllowHeaders:
          - Content-Type
        AllowOrigins:
          - '*'

  # ──────────────────────────────────────────────────────────────
  # Custom Domain — DNS + Mapping
  # ──────────────────────────────────────────────────────────────
  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Sub "user-rewards-api-${Environment}.communityfridgefinder.com"
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificate
          EndpointType: REGIONAL

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      DomainName: !Ref ApiDomainName
      ApiId: !Ref UserHttpApi
      Stage: !Ref UserHttpApi.Stage

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref CFMHostedZoneId
      Name: !Sub "user-rewards-api-${Environment}.communityfridgefinder.com"
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId

  # ──────────────────────────────────────────────────────────────
  # Lambda — Get User Action Stats
  # ──────────────────────────────────────────────────────────────
  GetUserActionStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "get-user-action-stats-${Environment}"
      CodeUri: functions/get_user_action_stats/
      Handler: app.handler
      Description: Returns the UserActionStats record for a given userId.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserActionStatsTable
      Events:
        GetUserActionStats:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserHttpApi
            Path: /v1/user-action-stats/{userId}
            Method: get

  # ──────────────────────────────────────────────────────────────
  # Lambda — Health Check Lambda Function
  # ──────────────────────────────────────────────────────────────
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "user-rewards-hello-${Environment}"
      CodeUri: functions/hello_world/
      Handler: app.lambda_handler
      Events:
        HelloWorld:
          Type: HttpApi
          Properties:
            ApiId: !Ref UserHttpApi
            Path: /hello
            Method: get
  # ──────────────────────────────────────────────────────────────
  # Lambda — Rewards Consumer
  # ──────────────────────────────────────────────────────────────
  UserRewardsConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "user-rewards-consumer-${Environment}"
      CodeUri: functions/fridge_report_consumer/
      Handler: app.handler
      Description: Consumes FridgeReportUpdated events and awards points.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt RewardsConsumerDLQ.Arn
      Environment:
        Variables:
          HISTORY_TABLE: !Ref UserPointsHistoryTable
          STATS_TABLE: !Ref UserActionStatsTable
          ENVIRONMENT: !Ref Environment
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserPointsHistoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserActionStatsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt RewardsConsumerDLQ.QueueName
      Events:
        StatusUpdateCreated:
          Type: EventBridgeRule
          Properties:
            EventBusName: !ImportValue
              Fn::Sub: "FridgeReportEventBusName-${Environment}"
            Pattern:
              detail-type:
                - FridgeReportUpdated

  # ──────────────────────────────────────────────────────────────
  # Lambda — User Deletion Handler
  # ──────────────────────────────────────────────────────────────
  UserDeletionHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "user-rewards-deletion-handler-${Environment}"
      CodeUri: functions/user_deletion_handler/
      Handler: app.handler
      Description: Cleans up reward data when a user is deleted.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserPointsHistoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserActionStatsTable

  # ──────────────────────────────────────────────────────────────
  # EventBridge — User Deletion Rule
  # ──────────────────────────────────────────────────────────────
  UserDeletionEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "user-rewards-deletion-cleanup-${Environment}"
      Description: Triggers reward data cleanup when a user is deleted
      EventBusName: !ImportValue
        Fn::Sub: "user-service-${Environment}-EventBusName"
      EventPattern:
        source:
          - user-service
        detail-type:
          - User Deleted
      State: ENABLED
      Targets:
        - Arn: !GetAtt UserDeletionHandlerFunction.Arn
          Id: UserDeletionHandlerTarget

  UserDeletionEventRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserDeletionHandlerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt UserDeletionEventRule.Arn

  # ──────────────────────────────────────────────────────────────
  # DynamoDB — UserPointsHistory
  # ──────────────────────────────────────────────────────────────
  UserPointsHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "user_points_history_${Environment}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: awardId
          AttributeType: S
        - AttributeName: occurredAt
          AttributeType: N
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: awardId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1-userId-occurredAt
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: occurredAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ──────────────────────────────────────────────────────────────
  # DynamoDB — UserActionStats
  # ──────────────────────────────────────────────────────────────
  UserActionStatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "user_action_stats_${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH


Outputs:
  RewardsConsumerDLQUrl:
    Description: URL of the Consumer DLQ
    Value: !Ref RewardsConsumerDLQ
    Export:
      Name: !Sub "${AWS::StackName}-DLQUrl"

  UserRewardsApiBaseUrl:
    Description: Base URL of the User Rewards API (custom domain)
    Value: !Sub "https://user-rewards-api-${Environment}.communityfridgefinder.com/"

  HelloWorldEndpoint:
    Description: GET health check endpoint URL
    Value: !Sub "https://user-rewards-api-${Environment}.communityfridgefinder.com/hello"

  GetUserActionStatsEndpoint:
    Description: GET user action stats endpoint URL
    Value: !Sub "https://user-rewards-api-${Environment}.communityfridgefinder.com/v1/user-action-stats/{userId}"
